<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lawchart — 지문을 넣으면 법률관계도가 그려진다</title>
<meta name="description" content="사실관계를 붙여넣으면 법률관계도와 시점별 권리 상태가 그려져요. 전부 브라우저 안에서 처리돼요.">
<style>
:root{
  --bg:#F6F5F2; --card:rgba(255,255,255,.72); --solid:#fff;
  --ink:#1B1B18; --sub:#6E6B64; --faint:#A9A69F;
  --line:rgba(27,27,24,.1); --line2:rgba(27,27,24,.18);
  --contract:#5B5BD6; --money:#0E9F6E; --security:#D97706; --dispute:#E02424; --status:#DB2777; --notice:#64748B; --other:#94A3B8;
  --shadow:0 12px 30px -18px rgba(27,27,24,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;line-height:1.55;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 40px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.brand{font-size:34px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(96deg,#1B1B18 20%,#5B5BD6 55%,#0E9F6E 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:12.5px;color:var(--sub)}
.panel{padding:8px;border-radius:24px;background:rgba(91,91,214,.07);border:1px solid rgba(91,91,214,.22)}
textarea{width:100%;min-height:160px;resize:vertical;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card);font-size:14.5px;line-height:1.7;word-break:keep-all;font-family:inherit}
textarea:focus{outline:none;border-color:var(--ink);background:var(--solid)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:650;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#fff}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff;border-color:transparent;font-size:15px;box-shadow:0 14px 30px -14px rgba(27,27,24,.55)}
.btn.ghost{flex:0 0 auto}
.count{font-size:11px;color:var(--faint);text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:700;color:var(--sub);margin:24px 4px 8px;display:flex;align-items:center;gap:7px}
.label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--contract);box-shadow:0 0 0 3px rgba(91,91,214,.2)}
.label .r{margin-left:auto;font-weight:500;color:var(--faint)}
#result[hidden]{display:none}
.canvas{position:relative;border-radius:20px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;touch-action:none}
.canvas svg{display:block;width:100%;height:auto;user-select:none}
.hint{font-size:11.5px;color:var(--faint);padding:8px 14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px 0;font-size:11.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:0;border-top:2.5px solid}
.tlbar{display:flex;align-items:center;gap:8px;margin:10px 0;padding:8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.tlbar input[type=range]{flex:1;accent-color:var(--contract);height:22px}
.tb{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--solid);cursor:pointer;font-size:15px;color:var(--sub)}
.tb.wide{width:auto;padding:0 12px;font-size:12px;font-weight:650}
#tl-now{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.timeline{margin-top:2px}
.ev{display:flex;gap:10px;padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:4px;font-size:13px}
.ev b{color:var(--contract);font-variant-numeric:tabular-nums;min-width:78px;font-weight:700}
.ev.fut{opacity:.35}
.er{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:4px;font-size:13px;cursor:pointer}
.er:hover{background:#fff}
.er time{font-size:11px;color:var(--contract);font-variant-numeric:tabular-nums}
.er b{font-weight:700}.er i{color:var(--faint);font-style:normal}
.er .lab{flex:1;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er .memo{flex-basis:100%;font-size:11.5px;color:var(--dispute);font-weight:650;padding-left:26px}
.er{flex-wrap:wrap}
.k-dot{width:9px;height:9px;border-radius:50%;flex:none}
.addrow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:6px}
.addrow i{color:var(--faint);font-style:normal;text-align:center}
input.field,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13.5px;font-family:inherit}
.addrow2{display:grid;grid-template-columns:1fr 130px auto;gap:6px;margin-top:6px}
.note{margin-top:30px;text-align:center;font-size:11.5px;color:var(--faint)}
.fut{opacity:.13}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:650;transition:.3s;z-index:50;max-width:90vw}
.toast.show{transform:translateX(-50%)}
/* SVG 내부 */
.node circle{fill:var(--solid);stroke:var(--ink);stroke-width:1.8;cursor:grab}
.node text{font:700 16px Pretendard,sans-serif;fill:var(--ink);pointer-events:none}
.node.thing rect{fill:rgba(91,91,214,.08);stroke:var(--contract);stroke-width:1.4;stroke-dasharray:5 3.5;cursor:grab}
.node.thing text{font:650 12.5px Pretendard,sans-serif}
.edge path{fill:none;stroke-width:2;cursor:pointer}
.edge .chip{fill:#fff;stroke:var(--line2);stroke-width:1}
.edge:hover .chip{stroke-width:1.6}
.edge text{font:650 11.5px Pretendard,sans-serif;fill:var(--ink);pointer-events:none}
.edge text.d{font-size:9.5px;fill:var(--sub);font-weight:600}
.edge text.i{font-size:10px;fill:var(--dispute);font-weight:750}
.arc path{fill:none;stroke-width:1.6;opacity:.85}
.arc text{font:700 10.5px Pretendard,sans-serif;fill:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">Lawchart</div><div class="tag">지문을 넣으면 법률관계도가 그려진다</div></header>

  <div class="panel">
    <textarea id="text" placeholder="사실관계를 붙여넣어요.&#10;예) 갑은 2020. 3. 1. 을에게 X토지를 3억원에 매도하고…"></textarea>
    <div class="count" id="count"></div>
    <div class="row">
      <label class="btn ghost">캡처 올리기<input id="img" type="file" accept="image/*" hidden></label>
      <button class="btn primary" id="draw">관계도 그리기</button>
      <button class="btn ghost" id="sample">예시</button>
      <button class="btn ghost" id="clear">지우기</button>
    </div>
  </div>

  <div id="result" hidden>
    <div class="label">관계도<span class="r">끌어 옮기기 · 두 번 눌러 이름 고치기 · 휠로 확대</span></div>
    <div class="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="legend" id="legend"></div>
    <div class="hint">화살표 이름을 누르면 고칠 수 있어요. 회색으로 흐려진 것은 선택 시점 이후의 사실이에요.</div>

    <div id="tl-wrap" hidden>
      <div class="label">시점별 권리 상태<span class="r" id="tl-now"></span></div>
      <div class="tlbar">
        <button class="tb" id="tl-prev" aria-label="이전">‹</button>
        <input type="range" id="tl-range" min="0" max="0" value="0">
        <button class="tb" id="tl-next" aria-label="다음">›</button>
        <button class="tb wide" id="tl-all">전체</button>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="label">관계 목록</div>
    <div id="edges"></div>
    <div class="addrow"><select id="add-from"></select><i>→</i><select id="add-to"></select></div>
    <div class="addrow2"><input class="field" id="add-label" placeholder="관계 (예: 매도 (X토지))"><button class="btn" id="add-btn">추가</button></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="add-party">+ 당사자</button>
      <button class="btn ghost" id="add-thing">+ 목적물</button>
      <button class="btn ghost" id="save-png">PNG</button>
      <button class="btn ghost" id="save-svg">SVG</button>
      <button class="btn ghost" id="save-case">사건 저장</button>
      <label class="btn ghost">사건 불러오기<input id="open-case" type="file" accept=".json" hidden></label>
    </div>
  </div>

  <div class="note">전부 브라우저 안에서 처리돼요. 지문은 어디로도 전송되지 않고, 작업 내용은 이 브라우저에 자동 저장돼요. <a href="./accuracy.html" style="color:var(--contract)">정확도 공개</a><br>관계도 도구의 원형 plot(app.yebni.cc)에서 영감을 받았습니다.</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
